    <link rel="icon" type="image/jpeg" href="/logo.jpg" />

    <meta name="theme-color" content="#ffffff" />

      name="description"
      content="ICPC NUB Community — the learning roadmap, session recordings, problem sheets and upsolve sessions in one place."

      media="print"
      onload="this.media='all'"

    <!-- Boots before any bundle or font arrives: a deep link on a cold 3G cache
         must never sit on an empty white page. createRoot() drops this node. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        color: #656e7a;
        font: 500 12px/1.6 ui-monospace, monospace;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-align: center;
      }
      #boot {
        display: grid;
        place-items: center;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">ICPC NUB — loading</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
